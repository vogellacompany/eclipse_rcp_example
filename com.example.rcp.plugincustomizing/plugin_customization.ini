# Default preferences for the Plugin Customization Example product.
# See https://github.com/eclipse-equinox/p2/blob/master/docs/Trust_Settings.md
#
# Format: <bundle-id>/<preference-key>=<value>
# Values defined here seed the *default* scope. Once the user changes a
# preference at runtime, the instance-scope value wins over what is set here.

# Silently trust all artifacts during p2 installs, including unsigned ones.
org.eclipse.equinox.p2.engine/trustAlways=true

# Silently trust all update site authorities (host certificates).
org.eclipse.equinox.p2.engine/trustAllAuthorities=true
org.eclipse.ui/SHOW_PROGRESS_ON_STARTUP = false

# General > Workspace > "Refresh using native hooks or polling"
# Backing constant: org.eclipse.core.resources.ResourcesPlugin.PREF_AUTO_REFRESH
org.eclipse.core.resources/refresh.enabled=true
